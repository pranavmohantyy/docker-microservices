version: '3'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - db_data:/app/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - db_data:/worker/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: