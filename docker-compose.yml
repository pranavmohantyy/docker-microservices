version: '3'\nservices:\n  api:\n    build:\n      context: ./api\n      dockerfile: Dockerfile\n    ports:\n      - '8000:8000'\n    volumes:\n      - db_data:/app/tasks.db\n    environment:\n      - DATABASE_URL=postgresql://user:password@db:5432/tasks\n    healthcheck:\n      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']\n      interval: 30s\n      timeout: 10s\n      retries: 3\n  worker:\n    build:\n      context: ./worker\n      dockerfile: Dockerfile\n    volumes:\n      - db_data:/worker/tasks.db\n    environment:\n      - DATABASE_URL=postgresql://user:password@db:5432/tasks\n      - REDIS_URL=\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    ports:\n      - '3000:3000'\n    depends_on:\n      - api\ndvolumes:\n  db_data: