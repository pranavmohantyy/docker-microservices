version: '3'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - db_data:/app/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - db_data:/worker/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
      - REDIS_URL=
  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
volumes:
  db_data: