version: '3'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - db_data:/app/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - db_data:/worker/tasks.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/tasks
      - REDIS_URL=redis://redis:6379/0
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data: