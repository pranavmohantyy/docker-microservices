version: '3'\nservices:\n  api:\n    build:\n      context: ./api\n      dockerfile: Dockerfile\n    ports:\n      - '8000:8000'\n    environment:\n      - DATABASE_URL=postgresql://user:password@db:5432/tasks\n    restart: always\n    deploy:\n      resources:\n        limits:\n          cpus: '0.5'\n          memory: 512M\n  worker:\n    build:\n      context: ./worker\n      dockerfile: Dockerfile\n    environment:\n      - DATABASE_URL=postgresql://user:password@db:5432/tasks\n      - REDIS_URL=redis://redis:6379\n    restart: always\n    deploy:\n      resources:\n        limits:\n          cpus: '0.5'\n          memory: 512M\n  db:\n    image: postgres:13\n    environment:\n      POSTGRES_USER: user\n      POSTGRES_PASSWORD: password\n    restart: always\n  redis:\n    image: redis:alpine\n    restart: always